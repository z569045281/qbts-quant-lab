AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  QBTS dashboard serverless jobs (Route A). Two Lambda functions from one
  container image: PublishFunction (on-demand button + daily schedule → fresh
  decision into Supabase) and QuoteFunction (live quotes every minute during
  US market hours).

Parameters:
  AnthropicApiKey:
    Type: String
    NoEcho: true
    Description: Anthropic API key — used by the Opus 4.8 decision call.
  SupabaseUrl:
    Type: String
    Description: https://<project>.supabase.co
  SupabaseSecretKey:
    Type: String
    NoEcho: true
    Description: Supabase secret/service key (write access — keep secret).
  FredApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      FRED (St. Louis Fed) API key — backfills macro-calendar actual values.
      Optional: blank just leaves actuals empty (forecast/previous still show).
  AdanosApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      Adanos API key (sk_live_…) — retail Reddit buzz + sentiment for the
      decision/edge. Optional: blank just leaves the sentiment signal off.
  DeepSeekApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      DeepSeek API key — V4 Pro shadow decision (Claude/DeepSeek toggle on the
      dashboard + bold-call shadow ledger, judged 8/15). Optional: blank = off.
  AllowOrigin:
    Type: String
    Default: "*"
    Description: >
      Browser origin allowed to call the publish Function URL, e.g.
      https://z569045281.github.io . "*" works but lets anyone trigger it.
  NtfyTopic:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      ntfy.sh topic for the SMC TRIGGER push. Blank = no push (intraday playbook
      still refreshes + shows on the dashboard). Pick an unguessable name and
      subscribe to it in the ntfy phone app.
  NtfyUrl:
    Type: String
    Default: "https://ntfy.sh"
    Description: ntfy server base URL (override only for a self-hosted instance).
  AlpacaApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      Alpaca PAPER API key — drives the challenge-2 auto-trader in QuoteFunction.
      Optional: blank just disables the challenge bot (everything else unaffected).
  AlpacaSecretKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Alpaca PAPER API secret (pair of AlpacaApiKey).

Globals:
  Function:
    Environment:
      Variables:
        ANTHROPIC_API_KEY: !Ref AnthropicApiKey
        SUPABASE_URL: !Ref SupabaseUrl
        SUPABASE_SECRET_KEY: !Ref SupabaseSecretKey
        FRED_API_KEY: !Ref FredApiKey
        ADANOS_API_KEY: !Ref AdanosApiKey
        DEEPSEEK_API_KEY: !Ref DeepSeekApiKey
        NTFY_TOPIC: !Ref NtfyTopic
        NTFY_URL: !Ref NtfyUrl
        ALPACA_API_KEY: !Ref AlpacaApiKey
        ALPACA_SECRET_KEY: !Ref AlpacaSecretKey

Resources:
  # ── Decision publish: button (Function URL) + daily auto-run ──────────────
  PublishFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ..
      Dockerfile: aws/Dockerfile
      DockerTag: qbts-publish
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["lambda_handlers.publish_handler"]
      MemorySize: 2048      # pandas/lightgbm + Opus call need headroom
      # 2026-08-05 由 300 提到 600:实测最近 7 次调用 224/229/233/263/265/270/284 秒,
      # 全部贴着 300 的天花板,而 08-04 11:39 那次直接 `Status: timeout`(300000ms)。
      # 第二考场(MU)要拉自己那两年小时线 + 一次 LLM,再挤 300 秒必然被砍。
      Timeout: 600          # full pipeline + Opus 4.8 + 第二考场
      FunctionUrlConfig:
        AuthType: NONE       # public URL; see README "Securing the button"
        Cors:
          AllowOrigins:
            - !Ref AllowOrigin
          AllowMethods:
            - POST
          AllowHeaders:
            - content-type
      Events:
        DailyMarketOpen:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 9 ? * MON-FRI *)"   # 09:00 ET weekdays
            ScheduleExpressionTimezone: America/New_York
            Description: Auto-publish a fresh decision at market open.
        SundayNightDecision:
          Type: ScheduleV2
          Properties:
            # 周日 20:05 ET = 美股夜盘开门 + BTC 周日 UTC 线刚定案 = 墨尔本周一 10:05。
            # 09:00 ET 那份只比开盘早 30 分钟,而夜盘那时已经跑了 13.5 小时 —— 周末
            # 消息(BTC/地缘)造成的跳空全部发生在用户拿到决策之前(2026-07-26 实例:
            # 夜盘 +3.2% 走完,23:00 墨尔本才收到决策)。这条把周一的决策提前 13 小时,
            # 落在用户能下单的第一刻。
            # 为什么是 :05 —— SundayNightBtc(cron 1/10 20-23)在 20:01 写第一条
            # live_quote,等到 20:05 周末BTC信号齐了、夜盘实时价也有一条 4 分钟内的。
            # 为什么锚 ET 而不是墨尔本 —— 两地夏令时切换错开(墨尔本 10 月初进、纽约
            # 11 月初退),锚墨尔本 10:00 会从 10 月起提前到 19:00/18:00 ET 开跑,那时
            # 夜盘还没开门、BTC 周日线还没定案,weekend_signal() 直接返回 None。
            # 台账不受影响:log_prediction 按 as_of 去重,这份与周一 09:00 那份的
            # as_of 同为上周五那根日线,只会记一条。
            ScheduleExpression: "cron(5 20 ? * SUN *)"
            ScheduleExpressionTimezone: America/New_York
            Description: Monday's decision at US overnight-session open (Sun 20:05 ET).

  # ── Live quotes: one push per minute during US market hours ───────────────
  QuoteFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ..
      Dockerfile: aws/Dockerfile
      DockerTag: qbts-quote
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["lambda_handlers.quote_handler"]
      MemorySize: 1024     # +pandas SMC playbook recompute (~every 5 min)
      Timeout: 90          # headroom for a cold-start bar fetch on the SMC minute
      Events:
        MarketHoursEveryMinute:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(* 4-19 ? * MON-FRI *)"  # 04:00–19:59 ET
            ScheduleExpressionTimezone: America/New_York
            Description: Push QBTS/QBTX/QBTZ quotes every minute (pre+regular+post).
        SundayNightBtc:
          Type: ScheduleV2
          Properties:
            # 周日 20:00 ET = 美股夜盘开门 = BTC 周日 UTC 线定案 → 周末BTC信号
            # 最早可推时刻(墨尔本周一上午 ~10 点)。分钟取 1/10 避开 %5==0
            # 的 SMC 重算分支。(周日夜盘报价也顺带每 10 分钟刷新一次。)
            ScheduleExpression: "cron(1/10 20-23 ? * SUN *)"
            ScheduleExpressionTimezone: America/New_York
            Description: Weekend-BTC signal at US overnight-session open (Sun 20:00 ET).
        OvernightEvening:
          Type: ScheduleV2
          Properties:
            # 🌙 Blue Ocean 夜盘(晚场):Mon-Thu 20:00-23:59 ET,每分钟推夜盘实时价
            # (Alpaca overnight feed)。补上用户在 moomoo 夜盘下单时仪表盘变黑的盲区。
            # 周日晚由 SundayNightBtc(每10分钟)覆盖,故此处只列 MON-THU 不重叠。
            ScheduleExpression: "cron(* 20-23 ? * MON-THU *)"
            ScheduleExpressionTimezone: America/New_York
            Description: Overnight (Blue Ocean) live quotes — evening leg (Mon-Thu 20:00 ET).
        OvernightMorning:
          Type: ScheduleV2
          Properties:
            # 🌙 Blue Ocean 夜盘(晨场尾):Mon-Fri 00:00-03:59 ET —— Sun-Thu 各夜的延续,
            # 接在 04:00 起的 MarketHoursEveryMinute(盘前)之前,填满整个夜盘窗。
            ScheduleExpression: "cron(* 0-3 ? * MON-FRI *)"
            ScheduleExpressionTimezone: America/New_York
            Description: Overnight (Blue Ocean) live quotes — early-morning leg (Mon-Fri 00:00-03:59 ET).

Outputs:
  PublishUrl:
    Description: Set this as NEXT_PUBLIC_PUBLISH_URL in the frontend build.
    Value: !GetAtt PublishFunctionUrl.FunctionUrl
